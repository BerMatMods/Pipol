<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>QR Scanner Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    h2 {
      margin: 15px 0;
    }

    #reader {
      width: 100%;
      max-width: 380px;
      margin: auto;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin: 15px;
      padding: 12px;
      background: #1e1e1e;
      border-radius: 10px;
      word-break: break-all;
    }

    button {
      margin: 8px;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 15px;
    }

    input {
      display: none;
    }
  </style>
</head>

<body>

<h2>📷 QR Scanner Pro</h2>

<div id="reader"></div>

<div>
  <button onclick="startCamera()">📸 Escanear QR</button>
  <button onclick="document.getElementById('fileInput').click()">🖼 Subir QR</button>
</div>

<input type="file" id="fileInput" accept="image/*">

<div id="result">Resultado aparecerá aquí...</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let html5QrCode;

// 📷 ESCANEAR CON CÁMARA
function startCamera() {
  stopScanner();

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    (decodedText) => {
      document.getElementById("result").innerText = "📌 QR: " + decodedText;
      stopScanner();
    }
  ).catch(err => {
    alert("Error cámara: " + err);
  });
}

// 🛑 detener cámara
function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
    }).catch(() => {});
  }
}

// 🖼 ESCANEAR IMAGEN
document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const qrScanner = new Html5Qrcode("reader");

  qrScanner.scanFile(file, true)
    .then(decodedText => {
      document.getElementById("result").innerText = "📌 QR: " + decodedText;
    })
    .catch(err => {
      alert("No se pudo leer el QR: " + err);
    });
});
</script>

</body>
</html>
